<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'nonce-strudel-host-bridge' 'unsafe-eval' https://unpkg.com; connect-src 'self' https://raw.githubusercontent.com https://*.githubusercontent.com https://felixroos.github.io https://cdn.freesound.org https://shabda.ndre.gr https://kabel.salat.dev https://strudel.cc https://*.strudel.cc; media-src 'self' https://raw.githubusercontent.com https://*.githubusercontent.com https://felixroos.github.io https://cdn.freesound.org https://shabda.ndre.gr https://kabel.salat.dev https://strudel.cc https://*.strudel.cc data: blob:; worker-src 'self' blob:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none';">
<meta name="referrer" content="no-referrer">
<title>Strudel editor and player</title>
<style>
  :root {
    --bg: #020402; --green: #00e060; --text: #609860;
    --muted: #3a5a3a; --border: #181818;
    --mono: "JetBrains Mono", "Red Hat Mono", Consolas, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
  body { color: var(--text); font-family: var(--mono); }
  strudel-editor { display: block; width: 100%; height: 100%; min-height: 0; overflow: auto; }
  .cm-editor { width: 100% !important; height: 100% !important; background: var(--bg) !important; font-size: .96rem !important; }
  .cm-editor .cm-scroller { font-family: var(--mono) !important; overflow-x: auto !important; }
  .cm-editor .cm-gutters { display: none !important; background: var(--bg) !important; border-right: 1px solid var(--border) !important; color: var(--muted) !important; }
  .cm-editor .cm-activeLineGutter, .cm-editor .cm-activeLine { background: rgba(0,224,96,.04) !important; }
  .cm-editor .cm-selectionBackground, .cm-editor ::selection { background: rgba(0,224,96,.15) !important; }
  .cm-editor .cm-cursor { border-left-color: var(--green) !important; }
  .cm-editor .cm-content { color: var(--text) !important; }
  .cm-editor .ͼ13, .cm-editor .ͼm { color: #3a5a3a !important; }
  .cm-editor .ͼ14, .cm-editor .ͼ19 { color: #00e060 !important; }
  .cm-editor .ͼz, .cm-editor .ͼd { color: #60c060 !important; }
  .cm-editor .ͼ11, .cm-editor .ͼe { color: #40c860 !important; }
  .cm-editor .ͼv, .cm-editor .ͼt, .cm-editor .ͼc { color: #80b880 !important; }
  .cm-editor .ͼ1c, .cm-editor .ͼ10, .cm-editor .ͼg { color: #90d090 !important; }
  .cm-editor .ͼ16 { color: #406040 !important; }
  .cm-editor { --foreground: var(--green) !important; }
  .cm-editor [style*="rgba(255,255,255"] { background-color: rgba(0,224,96,.12) !important; filter: none !important; }
  .cm-editor [style*="#00CA28"] { background-color: rgba(0,224,96,.15) !important; }
  .cm-editor [style*="outline"] { outline-color: var(--green) !important; }
  .cm-editor .cm-strudel-highlight { background: rgba(0,224,96,.06) !important; }
  @media (max-width: 900px) {
    .cm-editor .cm-content, .cm-editor .cm-line { white-space: pre-wrap !important; word-break: break-word !important; overflow-wrap: anywhere !important; }
  }
</style>
<script src="https://unpkg.com/@strudel/repl@1.3.0/dist/index.js" integrity="sha384-lCEvnEkKT0yduqm8nTtM4FQxz6oegFdhDdI1nOaIpPHuQ8v1PLH7ATGwV66YH+Ot" crossorigin="anonymous"></script>
</head>
<body>
<strudel-editor id="strudelEditor">@hush</strudel-editor>
<script src="strudel-host.js" nonce="strudel-host-bridge"></script>
</body>
</html>
