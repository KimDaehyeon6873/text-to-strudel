<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src http://localhost:8000 https://www.text-to-strudel.cc https://unpkg.com 'unsafe-eval'; connect-src http://localhost:8000 https://www.text-to-strudel.cc https://raw.githubusercontent.com https://*.githubusercontent.com https://felixroos.github.io https://cdn.freesound.org https://shabda.ndre.gr https://kabel.salat.dev https://strudel.cc https://*.strudel.cc; media-src http://localhost:8000 https://www.text-to-strudel.cc https://raw.githubusercontent.com https://*.githubusercontent.com https://felixroos.github.io https://cdn.freesound.org https://shabda.ndre.gr https://kabel.salat.dev https://strudel.cc https://*.strudel.cc data: blob:; worker-src http://localhost:8000 https://www.text-to-strudel.cc blob:; img-src http://localhost:8000 https://www.text-to-strudel.cc data:; style-src http://localhost:8000 https://www.text-to-strudel.cc 'unsafe-inline';">
<title>strudel-host</title>
<style>
  /* Editor surface — moved here from index.html so it applies inside the
     opaque-origin sandboxed iframe, where the parent's stylesheet does not. */
  :root {
    --bg: #020402;
    --g: #00e060;
    --g-mute: #004420;
    --txt-dim: #507050;
    --border: #181818;
    --mono: 'JetBrains Mono', 'Consolas', monospace;
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); color: #c0e0c0; height: 100%; width: 100%; overflow: hidden; }
  body { font-family: var(--mono); display: flex; flex-direction: column; }
  strudel-editor { display: block; flex: 1 1 auto; min-height: 0; overflow: auto; }

  /* CodeMirror theme overrides (matrix green on black). */
  .cm-editor {
    background: #020402 !important;
    font-size: .96rem !important;
    height: 100% !important;
  }
  .cm-editor .cm-scroller { font-family: var(--mono) !important; }
  .cm-editor .cm-gutters {
    background: #020402 !important;
    border-right: 1px solid var(--border) !important;
    color: var(--txt-dim) !important;
    display: none !important;
  }
  .cm-editor .cm-activeLineGutter,
  .cm-editor .cm-activeLine { background: rgba(0,224,96,.04) !important; }
  .cm-editor .cm-selectionBackground,
  .cm-editor ::selection { background: rgba(0,224,96,.15) !important; }
  .cm-editor .cm-cursor { border-left-color: var(--g) !important; }
  .cm-editor .cm-content { color: #609860 !important; }
  .cm-editor .ͼ13, .cm-editor .ͼm { color: #3a5a3a !important; }
  .cm-editor .ͼ14, .cm-editor .ͼ19 { color: #00e060 !important; }
  .cm-editor .ͼz, .cm-editor .ͼd { color: #60c060 !important; }
  .cm-editor .ͼ11, .cm-editor .ͼe { color: #40c860 !important; }
  .cm-editor .ͼv, .cm-editor .ͼt, .cm-editor .ͼc { color: #80b880 !important; }
  .cm-editor .ͼ1c, .cm-editor .ͼ10, .cm-editor .ͼg { color: #90d090 !important; }
  .cm-editor .ͼ16 { color: #406040 !important; }
  .cm-editor { --foreground: var(--g) !important; }
  .cm-editor [style*="rgba(255,255,255"] {
    background-color: rgba(0,224,96,.12) !important;
    filter: none !important;
  }
  .cm-editor [style*="#00CA28"] { background-color: rgba(0,224,96,.15) !important; }
  .cm-editor [style*="outline"] { outline-color: var(--g) !important; }
  .cm-editor .cm-strudel-highlight { background: rgba(0,224,96,.06) !important; }

  @media (max-width: 900px) {
    .cm-editor { max-width: 100% !important; width: 100% !important; }
    .cm-editor .cm-scroller { overflow-x: auto !important; }
    .cm-editor .cm-content,
    .cm-editor .cm-line {
      white-space: pre-wrap !important;
      word-break: break-word !important;
      overflow-wrap: anywhere !important;
    }
  }
</style>
<!-- Strudel REPL pinned to 1.3.0 with SRI integrity hash for supply-chain safety. -->
<script src="https://unpkg.com/@strudel/repl@1.3.0/dist/index.js"
        integrity="sha384-lCEvnEkKT0yduqm8nTtM4FQxz6oegFdhDdI1nOaIpPHuQ8v1PLH7ATGwV66YH+Ot"
        crossorigin="anonymous"></script>
</head>
<body>
<strudel-editor id="strudelEditor">
@hush
</strudel-editor>
<script src="strudel-host.js"></script>
</body>
</html>
